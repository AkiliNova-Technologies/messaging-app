name: Validate SecureLAN
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: securelan_dev
          POSTGRES_USER: securelan
          POSTGRES_PASSWORD: securelan-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securelan -d securelan_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/securelan_dev
      DATABASE_USER: securelan
      DATABASE_PASSWORD: securelan-ci-only-password
      SECURELAN_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test server and DB integration
        working-directory: server
        run: ./mvnw -B test
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck desktop
        working-directory: desktop
        run: npm run typecheck
      - name: Build desktop frontend
        working-directory: desktop
        run: npm run build
